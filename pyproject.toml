[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Social_Contact_Multiplex"
version = "0.1.0"
description = "Multiplex SIRS modeling with network analysis and scientific computing."
readme = "README.md"
requires-python = ">=3.12.9"
license = { text = "MIT" }

authors = [
    { name = "Brody Cates" }
]

dependencies = [
    "aiohappyeyeballs>=2.6",
    "aiohttp>=3.11",
    "aiosignal>=1.3",
    "attrs>=25.3",
    "backoff>=2.2",
    "certifi>=2025.1",
    "chardet>=5.2",
    "charset-normalizer>=3.4",
    "cmake>=4.0",
    "colorama>=0.4",
    "colorbrewer>=0.3",
    "colour>=0.1",
    "contourpy>=1.3",
    "cycler>=0.12",
    "decorator>=5.2",
    "filelock>=3.18",
    "fonttools>=4.56",
    "frozenlist>=1.6",
    "fsspec>=2025.3",
    "idna>=3.10",
    "igraph>=0.11",
    "Jinja2>=3.1",
    "joblib>=1.5",
    "kiwisolver>=1.4",
    "MarkupSafe>=3.0",
    "matplotlib>=3.10",
    "mpmath>=1.3",
    "multidict>=6.4",
    "networkx>=3.4",
    "numdifftools>=0.9",
    "numpy>=2.2",
    "packaging>=24.2",
    "pandas>=2.2",
    "pillow>=11.1",
    "propcache>=0.3",
    "psutil>=7.0",
    "py4cytoscape>=1.11",
    "pyparsing>=3.2",
    "python-dateutil>=2.9",
    "pytz>=2025.1",
    "requests>=2.32",
    "scikit-learn>=1.6",
    "scipy>=1.14",
    "setuptools>=80.4",
    "six>=1.17",
    "sympy>=1.14",
    "texttable>=1.7",
    "threadpoolctl>=3.6",
    "tqdm>=4.67",
    "typing_extensions>=4.13",
    "tzdata>=2025.1",
    "urllib3>=2.3",
    "yarl>=1.20"
]

[project.optional-dependencies]
dev = [
    "black",
    "ruff",
    "mypy",
    "ipykernel"
]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12.9"
strict = false
